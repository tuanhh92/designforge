[project]
name = "designforge-api"
version = "0.1.0"
description = "DesignForge MVP backend: FastAPI app, Postgres job queue worker, pipeline services"
requires-python = ">=3.12"
dependencies = [
  "designforge-core[ai,mcp]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "pillow>=11",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
df-api = "df_api.main:run"
df-worker = "df_worker.main:run"
df-migrate = "df_services.db:migrate_cli"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
df_services = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
