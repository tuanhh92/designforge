name: designforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: designforge
      POSTGRES_PASSWORD: designforge
      POSTGRES_DB: designforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
